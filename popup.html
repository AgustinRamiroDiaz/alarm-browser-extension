<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Timer Warnings</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div>
          <h1>Timers</h1>
          <p id="summary">No active timers</p>
        </div>
      </header>

      <form id="timerForm" class="timer-form">
        <label>
          <span>Name</span>
          <input id="label" name="label" type="text" maxlength="48" placeholder="Focus block">
        </label>

        <div class="split">
          <label>
            <span>Duration</span>
            <div class="inline-input">
              <input id="duration" name="duration" type="number" min="1" max="1440" value="25" required>
              <span>min</span>
            </div>
          </label>

          <label>
            <span>Warn before</span>
            <div class="inline-input">
              <input id="warning" name="warning" type="number" min="0" max="1439" value="5" required>
              <span>min</span>
            </div>
          </label>
        </div>

        <button type="submit">Start timer</button>
        <p id="formError" class="error" role="status"></p>
      </form>

      <section aria-label="Active timers">
        <ul id="timerList" class="timer-list"></ul>
        <p id="emptyState" class="empty">Create a timer and Chrome will notify you before it finishes.</p>
      </section>
    </main>

    <script type="module" src="dist/popup.js"></script>
  </body>
</html>
