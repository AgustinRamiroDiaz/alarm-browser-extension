<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Timer Warnings</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app">
      <section class="timers-section" aria-label="Active timers">
        <ul id="timerList" class="timer-list"></ul>
        <p id="emptyState" class="empty">Create a timer and Chrome will notify you before it finishes.</p>
      </section>

      <form id="timerForm" class="timer-form">
        <label>
          <span>Name</span>
          <input id="label" name="label" type="text" maxlength="48" placeholder="Focus block">
        </label>

        <div class="split">
          <label>
            <span>Duration</span>
            <div class="inline-input">
              <input id="duration" name="duration" type="number" min="1" max="1440" value="25" required>
              <span>min</span>
            </div>
          </label>

          <label>
            <span>Warn before</span>
            <div class="inline-input">
              <input id="warning" name="warning" type="number" min="0" max="24" value="5" required>
              <span>min</span>
            </div>
          </label>
        </div>

        <button type="submit">Start timer</button>
        <p id="formError" class="error" role="status"></p>
      </form>

      <details class="debug-panel">
        <summary>Advanced diagnostics</summary>
        <div class="status-row">
          <p id="notificationStatus" class="status" role="status">Checking notification access...</p>
          <button id="testNotification" class="icon-button" type="button" title="Test notification" aria-label="Test notification">Test</button>
        </div>
        <form id="debugTimerForm" class="debug-timer-form">
          <label>
            <span>Test duration</span>
            <div class="inline-input">
              <input id="debugDuration" name="debugDuration" type="number" min="1" max="3600" value="10" required>
              <span>sec</span>
            </div>
          </label>
          <label>
            <span>Warn before</span>
            <div class="inline-input">
              <input id="debugWarning" name="debugWarning" type="number" min="0" max="9" value="5" required>
              <span>sec</span>
            </div>
          </label>
          <button type="submit">Start test timer</button>
          <p id="debugTimerError" class="error" role="status"></p>
        </form>
      </details>
    </main>

    <script type="module" src="dist/popup.js"></script>
  </body>
</html>
